name: Update GIS GeoJSON Data

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs weekly every Sunday at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger via GitHub interface

jobs:
  sync-gis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and process ArcGIS layers
        run: python fetch_data.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "Auto-update GIS construction data [skip ci]"
            git push
          fi
