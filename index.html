<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Paso Construction Permit & Analytics Dashboard</title>

  <!-- Leaflet & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.94);
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-res: #3b82f6;
      --accent-com: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #020617;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p { font-size: 0.8rem; color: var(--text-muted); }

    #main-container { display: flex; flex: 1; position: relative; }
    #map { flex: 1; height: 100%; background-color: #020617; }

    /* Sidebar Panel */
    .dashboard-sidebar {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      width: 380px;
      max-height: calc(100vh - 4.5rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      pointer-events: none;
      padding-right: 4px;
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      pointer-events: auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .metric-box { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.6rem; }
    .metric-box.full-width { grid-column: span 2; }
    .metric-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .metric-value { font-size: 1.15rem; font-weight: 700; margin-top: 0.1rem; }
    .metric-value.res { color: #60a5fa; }
    .metric-value.com { color: #f87171; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.3rem;
      margin-bottom: 0.5rem;
    }

    .section-title { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }

    .expand-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .expand-btn:hover { background: #334155; }

    .filter-group { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.2rem; }
    .filter-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .badge-dot { width: 10px; height: 10px; border-radius: 50%; }
    .badge-res { background-color: var(--accent-res); }
    .badge-com { background-color: var(--accent-com); }

    /* Custom Dropdowns */
    .dropdown-container { display: flex; flex-direction: column; gap: 0.4rem; }
    .dropdown-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .dropdown-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; }
    select {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.4rem;
      font-size: 0.8rem;
      outline: none;
      width: 100%;
    }

    .chart-container { position: relative; height: 170px; width: 100%; }

    /* Modal for Expanded Analytics */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 85vw;
      height: 75vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .modal-body { flex: 1; position: relative; width: 100%; }

    /* Leaflet Popups */
    .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; }
    .leaflet-popup-tip { background: #1e293b; }
    .popup-content h3 { font-size: 0.9rem; margin-bottom: 0.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2rem; }
    .popup-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 0.2rem; }
    .popup-row .label { color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>El Paso Building Permit & Spatial Analytics</h1>
      <p>Multi-Dimensional Filter & Smooth Trend Dashboard</p>
    </div>
  </header>

  <div id="main-container">
    <div class="dashboard-sidebar">
      
      <!-- Metrics Card -->
      <div class="panel-card">
        <div class="metrics-grid">
          <div class="metric-box full-width">
            <div class="metric-title">Filtered Active Permits</div>
            <div class="metric-value" id="total-count">--</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Residential</div>
            <div class="metric-value res" id="res-count">--</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Commercial</div>
            <div class="metric-value com" id="com-count">--</div>
          </div>
        </div>
      </div>

      <!-- Filters Panel -->
      <div class="panel-card">
        <div class="section-header">
          <span class="section-title">Filter Controls</span>
        </div>

        <div class="filter-group">
          <label class="filter-item">
            <span class="checkbox-label"><span class="badge-dot badge-res"></span>Residential</span>
            <input type="checkbox" id="toggle-res" checked />
          </label>
          <label class="filter-item">
            <span class="checkbox-label"><span class="badge-dot badge-com"></span>Commercial</span>
            <input type="checkbox" id="toggle-com" checked />
          </label>
        </div>

        <div class="dropdown-container" style="margin-top: 0.6rem;">
          <div class="dropdown-group">
            <span class="dropdown-label">Representative District</span>
            <select id="filter-district"><option value="ALL">All Districts</option></select>
          </div>
          <div class="dropdown-group">
            <span class="dropdown-label">Type of Development</span>
            <select id="filter-devtype"><option value="ALL">All Development Types</option></select>
          </div>
          <div class="dropdown-group">
            <span class="dropdown-label">Type of Permit</span>
            <select id="filter-permittype"><option value="ALL">All Permit Types</option></select>
          </div>
        </div>
      </div>

      <!-- Time Series Sidebar Chart -->
      <div class="panel-card">
        <div class="section-header">
          <span class="section-title">Permits Issued by Month / Year</span>
          <button class="expand-btn" id="expand-chart">Expand ↗</button>
        </div>
        <div class="chart-container">
          <canvas id="timeSeriesChart"></canvas>
        </div>
      </div>

    </div>

    <div id="map"></div>
  </div>

  <!-- Fullscreen Chart Modal -->
  <div class="modal-overlay" id="chart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="font-size: 1.1rem;">Monthly Permit Trends (Smoothed Curve)</h2>
        <button class="modal-close" id="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <canvas id="modalTimeSeriesChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const map = L.map('map', { center: [31.7619, -106.4850], zoom: 11, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    const DATA_PATH = 'https://raw.githubusercontent.com/hoffmanap/permits/main/data/';

    const clusterRes = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 40 });
    const clusterCom = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 40 });

    let rawDataStore = { residential: [], commercial: [] };
    let timeChart, modalChart;

    const getVal = (props, keys) => {
      for (const k of keys) {
        if (props[k] !== undefined && props[k] !== null && props[k] !== '') return props[k];
      }
      return null;
    };

    function buildPopup(props, type) {
      const addr = getVal(props, ['Address', 'ADDRESS', 'Address_1', 'SITE_ADDRESS', 'LOCATION']) || 'El Paso Location';
      const permitId = getVal(props, ['Permit_ID', 'PermitID', 'PERMITID', 'PERMIT_ID', 'Permit_Number', 'PERMIT_NUM']) || 'N/A';
      
      const rawDate = getVal(props, ['Issue_Date', 'IssueDate', 'ISSUE_DATE', 'Issued_Date', 'DATE']);
      let dateStr = 'N/A';
      if (rawDate) {
        const d = new Date(typeof rawDate === 'number' ? rawDate : rawDate);
        dateStr = !isNaN(d.getTime()) ? d.toLocaleDateString() : rawDate;
      }

      const comments = getVal(props, ['Comments', 'Type_of_Development', 'Type_of_Permit', 'DESCRIPTION']) || '';
      const district = getVal(props, ['District', 'DISTRICT', 'Council_District']) || '';

      return `
        <div class="popup-content">
          <h3>${addr}</h3>
          <div class="popup-row"><span class="label">Type:</span><span><strong>${type}</strong></span></div>
          <div class="popup-row"><span class="label">Permit ID:</span><span><strong>${permitId}</strong></span></div>
          <div class="popup-row"><span class="label">Issue Date:</span><span>${dateStr}</span></div>
          ${district ? `<div class="popup-row"><span class="label">District:</span><span>District ${district}</span></div>` : ''}
          ${comments ? `<div class="popup-row" style="margin-top:4px; flex-direction:column; gap:2px;"><span class="label">Details:</span><span style="font-size:0.75rem; color:#cbd5e1;">${comments}</span></div>` : ''}
        </div>
      `;
    }

    function getCentroid(coords, geomType) {
      if (geomType === 'Point') return [coords[1], coords[0]];
      let ring = coords;
      if (geomType === 'Polygon') ring = coords[0];
      if (geomType === 'MultiPolygon') ring = coords[0][0];

      let latSum = 0, lngSum = 0, count = 0;
      for (let i = 0; i < ring.length; i++) {
        lngSum += ring[i][0]; latSum += ring[i][1]; count++;
      }
      return [latSum / count, lngSum / count];
    }

    async function fetchDataset(filename) {
      try {
        const res = await fetch(`${DATA_PATH}${filename}`);
        if (!res.ok) return [];
        const data = await res.json();
        return data.features || [];
      } catch (e) {
        console.error(`Error loading ${filename}`, e);
        return [];
      }
    }

    // Populate Filter Dropdowns dynamically from JSON properties
    function populateDropdowns() {
      const districts = new Set();
      const devTypes = new Set();
      const permitTypes = new Set();

      const scanProps = (features) => {
        features.forEach(f => {
          const p = f.properties || {};
          const dist = getVal(p, ['District', 'DISTRICT', 'Council_District']);
          const dev = getVal(p, ['Type_of_Development', 'DEVELOPMENT_TYPE', 'Type_Development']);
          const per = getVal(p, ['Type_of_Permit', 'PERMIT_TYPE', 'Type_Permit']);

          if (dist) districts.add(String(dist).trim());
          if (dev) devTypes.add(String(dev).trim());
          if (per) permitTypes.add(String(per).trim());
        });
      };

      scanProps(rawDataStore.residential);
      scanProps(rawDataStore.commercial);

      const addOptions = (elemId, values) => {
        const select = document.getElementById(elemId);
        Array.from(values).sort().forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        });
      };

      addOptions('filter-district', districts);
      addOptions('filter-devtype', devTypes);
      addOptions('filter-permittype', permitTypes);
    }

    // Dynamic Record Filter matching dropdown criteria
    function filterFeatures(features) {
      const distFilter = document.getElementById('filter-district').value;
      const devFilter = document.getElementById('filter-devtype').value;
      const permFilter = document.getElementById('filter-permittype').value;

      return features.filter(f => {
        const p = f.properties || {};
        if (distFilter !== 'ALL') {
          const val = getVal(p, ['District', 'DISTRICT', 'Council_District']);
          if (String(val).trim() !== distFilter) return false;
        }
        if (devFilter !== 'ALL') {
          const val = getVal(p, ['Type_of_Development', 'DEVELOPMENT_TYPE', 'Type_Development']);
          if (String(val).trim() !== devFilter) return false;
        }
        if (permFilter !== 'ALL') {
          const val = getVal(p, ['Type_of_Permit', 'PERMIT_TYPE', 'Type_Permit']);
          if (String(val).trim() !== permFilter) return false;
        }
        return true;
      });
    }

    function renderLayers() {
      clusterRes.clearLayers();
      clusterCom.clearLayers();

      const showRes = document.getElementById('toggle-res').checked;
      const showCom = document.getElementById('toggle-com').checked;

      const filteredRes = showRes ? filterFeatures(rawDataStore.residential) : [];
      const filteredCom = showCom ? filterFeatures(rawDataStore.commercial) : [];

      const addMarkers = (features, clusterGroup, color, label) => {
        const markers = [];
        features.forEach(f => {
          if (!f.geometry || !f.geometry.coordinates) return;
          const latlng = getCentroid(f.geometry.coordinates, f.geometry.type);
          if (isNaN(latlng[0]) || isNaN(latlng[1])) return;

          const m = L.circleMarker(latlng, {
            radius: 5, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.8
          }).bindPopup(buildPopup(f.properties, label));
          markers.push(m);
        });
        clusterGroup.addLayers(markers);
      };

      if (showRes) addMarkers(filteredRes, clusterRes, '#3b82f6', 'Residential');
      if (showCom) addMarkers(filteredCom, clusterCom, '#ef4444', 'Commercial');

      document.getElementById('res-count').textContent = filteredRes.length.toLocaleString();
      document.getElementById('com-count').textContent = filteredCom.length.toLocaleString();
      document.getElementById('total-count').textContent = (filteredRes.length + filteredCom.length).toLocaleString();

      updateCharts(filteredRes, filteredCom);
    }

    function aggregateMonthly(resFeatures, comFeatures) {
      const counts = {};

      const process = (features, key) => {
        features.forEach(f => {
          const p = f.properties || {};
          let rawDate = getVal(p, ['Issue_Date', 'IssueDate', 'ISSUE_DATE', 'Issued_Date', 'DATE']);
          
          let dateObj;
          if (typeof rawDate === 'number') {
            dateObj = new Date(rawDate);
          } else if (rawDate) {
            dateObj = new Date(rawDate);
          } else {
            const y = getVal(p, ['Year_Issued', 'YearIssued', 'YEAR_ISSUED']);
            if (y) dateObj = new Date(`${y}-01-01`);
          }

          if (!dateObj || isNaN(dateObj.getTime())) return;

          const mKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
          if (!counts[mKey]) counts[mKey] = { residential: 0, commercial: 0 };
          counts[mKey][key]++;
        });
      };

      process(resFeatures, 'residential');
      process(comFeatures, 'commercial');

      const months = Object.keys(counts).sort();
      return {
        labels: months,
        resData: months.map(m => counts[m].residential),
        comData: months.map(m => counts[m].commercial)
      };
    }

    function initCharts() {
      const chartConfig = (ctx) => ({
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Residential',
              data: [],
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.15)',
              fill: true,
              cubicInterpolationMode: 'monotone', // Smoothed line curve
              tension: 0.4
            },
            {
              label: 'Commercial',
              data: [],
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.15)',
              fill: true,
              cubicInterpolationMode: 'monotone', // Smoothed line curve
              tension: 0.4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: '#1e293b' }, beginAtZero: true }
          }
        }
      });

      timeChart = new Chart(document.getElementById('timeSeriesChart').getContext('2d'), chartConfig());
      modalChart = new Chart(document.getElementById('modalTimeSeriesChart').getContext('2d'), chartConfig());
    }

    function updateCharts(resFeatures, comFeatures) {
      const data = aggregateMonthly(resFeatures, comFeatures);

      [timeChart, modalChart].forEach(chart => {
        chart.data.labels = data.labels;
        chart.data.datasets[0].data = data.resData;
        chart.data.datasets[1].data = data.comData;
        chart.update();
      });
    }

    async function init() {
      initCharts();

      map.addLayer(clusterRes);
      map.addLayer(clusterCom);

      const [resData, comData] = await Promise.all([
        fetchDataset('residential.geojson'),
        fetchDataset('commercial.geojson')
      ]);

      rawDataStore.residential = resData;
      rawDataStore.commercial = comData;

      populateDropdowns();
      renderLayers();

      // Zoom to layer bounds
      const bounds = L.latLngBounds();
      if (clusterRes.getBounds().isValid()) bounds.extend(clusterRes.getBounds());
      if (clusterCom.getBounds().isValid()) bounds.extend(clusterCom.getBounds());
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });

      // Change Listeners
      ['toggle-res', 'toggle-com', 'filter-district', 'filter-devtype', 'filter-permittype'].forEach(id => {
        document.getElementById(id).addEventListener('change', renderLayers);
      });

      // Modal Triggers
      document.getElementById('expand-chart').addEventListener('click', () => {
        document.getElementById('chart-modal').style.display = 'flex';
        modalChart.resize();
      });
      document.getElementById('close-modal').addEventListener('click', () => {
        document.getElementById('chart-modal').style.display = 'none';
      });
    }

    init();
  </script>
</body>
</html>
