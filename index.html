<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Paso Construction Permit & Analytics Dashboard</title>

  <!-- Leaflet & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.92);
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-res: #3b82f6;
      --accent-com: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #020617;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p { font-size: 0.8rem; color: var(--text-muted); }

    #main-container { display: flex; flex: 1; position: relative; }
    #map { flex: 1; height: 100%; background-color: #020617; }

    /* Floating Analytics & Controls Panel */
    .dashboard-sidebar {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      width: 380px;
      max-height: calc(100vh - 5rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      pointer-events: none;
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      pointer-events: auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .metric-box { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.6rem; }
    .metric-box.full-width { grid-column: span 2; }
    .metric-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .metric-value { font-size: 1.15rem; font-weight: 700; margin-top: 0.1rem; }
    .metric-value.res { color: #60a5fa; }
    .metric-value.com { color: #f87171; }

    .chart-container { position: relative; height: 160px; width: 100%; margin-top: 0.5rem; }
    .section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2rem; }

    .filter-group { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.3rem; }
    .filter-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; cursor: pointer; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; }
    .badge-dot { width: 10px; height: 10px; border-radius: 50%; }
    .badge-res { background-color: var(--accent-res); }
    .badge-com { background-color: var(--accent-com); }

    /* Custom Cluster Markers */
    .marker-cluster-small { background-color: rgba(59, 130, 246, 0.6); }
    .marker-cluster-small div { background-color: rgba(37, 99, 235, 0.85); color: #fff; }
    .marker-cluster-medium { background-color: rgba(234, 179, 8, 0.6); }
    .marker-cluster-medium div { background-color: rgba(202, 138, 4, 0.85); color: #fff; }
    .marker-cluster-large { background-color: rgba(239, 68, 68, 0.6); }
    .marker-cluster-large div { background-color: rgba(220, 38, 38, 0.85); color: #fff; }

    .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; }
    .leaflet-popup-tip { background: #1e293b; }
    .popup-content h3 { font-size: 0.9rem; margin-bottom: 0.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2rem; }
    .popup-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 0.2rem; }
    .popup-row .label { color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>El Paso Construction Permit & Analytics Dashboard</h1>
      <p>Real-Time Spatial Clustering & Trend Analysis</p>
    </div>
  </header>

  <div id="main-container">
    <div class="dashboard-sidebar">
      
      <!-- Metrics Card -->
      <div class="panel-card">
        <div class="metrics-grid">
          <div class="metric-box full-width">
            <div class="metric-title">Total Active Permits</div>
            <div class="metric-value" id="total-count">--</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Residential</div>
            <div class="metric-value res" id="res-count">--</div>
          </div>
          <div class="metric-box">
            <div class="metric-title">Commercial</div>
            <div class="metric-value com" id="com-count">--</div>
          </div>
        </div>
      </div>

      <!-- Controls Card -->
      <div class="panel-card">
        <div class="section-title">Layer Control</div>
        <div class="filter-group">
          <label class="filter-item">
            <span class="checkbox-label"><span class="badge-dot badge-res"></span>New Residential</span>
            <input type="checkbox" id="toggle-res" checked />
          </label>
          <label class="filter-item">
            <span class="checkbox-label"><span class="badge-dot badge-com"></span>New Commercial</span>
            <input type="checkbox" id="toggle-com" checked />
          </label>
        </div>
      </div>

      <!-- Time Series Chart Card -->
      <div class="panel-card">
        <div class="section-title">Permits Issued by Month / Year</div>
        <div class="chart-container">
          <canvas id="timeSeriesChart"></canvas>
        </div>
      </div>

      <!-- Volume Breakdown Chart Card -->
      <div class="panel-card">
        <div class="section-title">Permit Volume & Share by Use Type</div>
        <div class="chart-container">
          <canvas id="typeDoughnutChart"></canvas>
        </div>
      </div>

    </div>

    <div id="map"></div>
  </div>

  <!-- Leaflet & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const map = L.map('map', { center: [31.7619, -106.4850], zoom: 11, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    const DATA_PATH = 'https://raw.githubusercontent.com/hoffmanap/permits/main/data/';

    // MarkerCluster Layer Groups for fast rendering
    const clusterRes = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
    const clusterCom = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });

    let rawDataStore = { residential: [], commercial: [] };
    let timeChart, typeChart;

    function buildPopup(props, type) {
      const getVal = (keys) => {
        const k = keys.find(x => props[x] !== undefined && props[x] !== null);
        return k ? props[k] : 'N/A';
      };

      const addr = getVal(['ADDRESS', 'Address', 'PROP_ADDR', 'SITE_ADDRESS', 'STREET_ADDRESS']);
      const num = getVal(['PERMIT_NUM', 'PermitNumber', 'RECORD_ID', 'OBJECTID']);
      const val = getVal(['VALUATION', 'Valuation', 'JOB_VALUE']);
      const date = getVal(['ISSUE_DATE', 'IssuedDate', 'DATE']);

      return `
        <div class="popup-content">
          <h3>${addr}</h3>
          <div class="popup-row"><span class="label">Type:</span><span><strong>${type}</strong></span></div>
          <div class="popup-row"><span class="label">Permit #:</span><span>${num}</span></div>
          <div class="popup-row"><span class="label">Issued:</span><span>${date}</span></div>
          <div class="popup-row"><span class="label">Valuation:</span><span>${typeof val === 'number' ? '$' + val.toLocaleString() : val}</span></div>
        </div>
      `;
    }

    // Helper to calculate geometry centroid for polygon features
    function getCentroid(coords, geomType) {
      if (geomType === 'Point') return [coords[1], coords[0]];
      
      let ring = coords;
      if (geomType === 'Polygon') ring = coords[0];
      if (geomType === 'MultiPolygon') ring = coords[0][0];

      let latSum = 0, lngSum = 0, count = 0;
      for (let i = 0; i < ring.length; i++) {
        lngSum += ring[i][0];
        latSum += ring[i][1];
        count++;
      }
      return [latSum / count, lngSum / count];
    }

    async function fetchDataset(filename) {
      try {
        const response = await fetch(`${DATA_PATH}${filename}`);
        if (!response.ok) return [];
        const data = await response.json();
        return data.features || [];
      } catch (e) {
        console.error(`Failed loading ${filename}`, e);
        return [];
      }
    }

    function processLayer(features, clusterGroup, color, label) {
      const markers = [];
      features.forEach(f => {
        if (!f.geometry || !f.geometry.coordinates) return;
        const latlng = getCentroid(f.geometry.coordinates, f.geometry.type);
        if (isNaN(latlng[0]) || isNaN(latlng[1])) return;

        const marker = L.circleMarker(latlng, {
          radius: 5,
          fillColor: color,
          color: '#ffffff',
          weight: 1,
          fillOpacity: 0.8
        }).bindPopup(buildPopup(f.properties, label));

        markers.push(marker);
      });

      clusterGroup.addLayers(markers);
      map.addLayer(clusterGroup);
      return markers.length;
    }

    // Process dates into Monthly Aggregations (YYYY-MM)
    function aggregateMonthlyData() {
      const monthlyCounts = {};

      const processRecords = (features, typeKey) => {
        features.forEach(f => {
          const props = f.properties || {};
          const rawDate = props.ISSUE_DATE || props.IssuedDate || props.DATE;
          if (!rawDate) return;

          const dateObj = new Date(rawDate);
          if (isNaN(dateObj.getTime())) return;

          const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
          if (!monthlyCounts[monthKey]) {
            monthlyCounts[monthKey] = { residential: 0, commercial: 0 };
          }
          monthlyCounts[monthKey][typeKey]++;
        });
      };

      if (document.getElementById('toggle-res').checked) processRecords(rawDataStore.residential, 'residential');
      if (document.getElementById('toggle-com').checked) processRecords(rawDataStore.commercial, 'commercial');

      const sortedMonths = Object.keys(monthlyCounts).sort();
      return {
        labels: sortedMonths,
        residential: sortedMonths.map(m => monthlyCounts[m].residential),
        commercial: sortedMonths.map(m => monthlyCounts[m].commercial)
      };
    }

    function initCharts() {
      // Time Series Line Chart
      const ctxTime = document.getElementById('timeSeriesChart').getContext('2d');
      timeChart = new Chart(ctxTime, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'Res', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 },
            { label: 'Com', data: [], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: '#1e293b' } }
          }
        }
      });

      // Volume Breakdown Doughnut Chart
      const ctxType = document.getElementById('typeDoughnutChart').getContext('2d');
      typeChart = new Chart(ctxType, {
        type: 'doughnut',
        data: {
          labels: ['Residential', 'Commercial'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#3b82f6', '#ef4444'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } }
        }
      });
    }

    function updateCharts() {
      const timeData = aggregateMonthlyData();
      timeChart.data.labels = timeData.labels;
      timeChart.data.datasets[0].data = timeData.residential;
      timeChart.data.datasets[1].data = timeData.commercial;
      timeChart.update();

      const resCount = document.getElementById('toggle-res').checked ? rawDataStore.residential.length : 0;
      const comCount = document.getElementById('toggle-com').checked ? rawDataStore.commercial.length : 0;
      
      typeChart.data.datasets[0].data = [resCount, comCount];
      typeChart.update();
    }

    async function initDashboard() {
      initCharts();

      const [resFeatures, comFeatures] = await Promise.all([
        fetchDataset('residential.geojson'),
        fetchDataset('commercial.geojson')
      ]);

      rawDataStore.residential = resFeatures;
      rawDataStore.commercial = comFeatures;

      const resCount = processLayer(resFeatures, clusterRes, '#3b82f6', 'Residential');
      const comCount = processLayer(comFeatures, clusterCom, '#ef4444', 'Commercial');

      document.getElementById('res-count').textContent = resCount.toLocaleString();
      document.getElementById('com-count').textContent = comCount.toLocaleString();
      document.getElementById('total-count').textContent = (resCount + comCount).toLocaleString();

      updateCharts();

      // Fit map bounds
      const bounds = L.latLngBounds();
      if (clusterRes.getBounds().isValid()) bounds.extend(clusterRes.getBounds());
      if (clusterCom.getBounds().isValid()) bounds.extend(clusterCom.getBounds());
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50] });

      // Interactive Toggles
      document.getElementById('toggle-res').addEventListener('change', (e) => {
        if (e.target.checked) map.addLayer(clusterRes);
        else map.removeLayer(clusterRes);
        updateCharts();
      });

      document.getElementById('toggle-com').addEventListener('change', (e) => {
        if (e.target.checked) map.addLayer(clusterCom);
        else map.removeLayer(clusterCom);
        updateCharts();
      });
    }

    initDashboard();
  </script>
</body>
</html>
